name: Documentation and Test File Hygiene

on:
  workflow_call:
    outputs:
      application_required:
        description: Whether the existing application CI job is required
        value: ${{ jobs.check.outputs.application_required }}
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional exact comparison base; manual default is HEAD first parent
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Portable source and documentation checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      application_required: ${{ steps.scope.outputs.application_required }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Configure pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # existing reviewed pin
        with:
          python-version-file: .python-version
      - name: Resolve exact event range
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          MODE=direct
          case "$EVENT" in
            pull_request) BASE="$PR_BASE"; MODE=merge-base ;;
            push) BASE="$PUSH_BASE" ;;
            workflow_dispatch) BASE="${MANUAL_BASE:-$(git rev-parse HEAD^)}" ;;
            *) echo "Unsupported event" >&2; exit 2 ;;
          esac
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE}^{commit}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          mkdir -p .runtime/file-hygiene
      - name: Install hash-pinned Markdown parser in this temporary runner
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r tools/file_hygiene_requirements.txt
      - name: Classify changed scope
        id: scope
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          MODE: ${{ steps.range.outputs.mode }}
        run: python -m tools.ci_scope --base "$BASE" --head "$HEAD" --comparison "$MODE" | tee .runtime/file-hygiene/scope.json
      - name: Run portable regression and existing instruction contracts
        run: |
          set -euo pipefail
          python -m unittest -v tools.test_file_hygiene tools.test_file_hygiene_regressions tools.test_file_hygiene_markdown tools.test_file_hygiene_policy tools.test_ci_scope tools.test_source_alignment 2>&1 | tee .runtime/file-hygiene/tests.log
      - name: Validate changed documents and tests
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
          MODE: ${{ steps.range.outputs.mode }}
        run: python -m tools.file_hygiene --base "$BASE" --head "$HEAD" --comparison "$MODE" | tee .runtime/file-hygiene/check.json
      - name: Upload exact-source portable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: file-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: .runtime/file-hygiene/
          if-no-files-found: error
          retention-days: 14
