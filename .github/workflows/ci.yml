name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend, tooling and frontend gates
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor == 'spikeal8-maker'
      )
    runs-on: [self-hosted, windows, x64, izo-ci]
    timeout-minutes: 45

    steps:
      - name: Assert trusted isolated runner
        shell: powershell
        run: |
          if ($env:IZO_CI_RUNNER_TRUSTED -ne "1") {
            throw "The izo-ci runner is missing its trusted isolation marker."
          }
          if ($env:RUNNER_NAME -notlike "izo-ci-*") {
            throw "Unexpected runner identity: $env:RUNNER_NAME"
          }

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve supply-chain event range
        id: supply_chain_range
        shell: powershell
        env:
          IZO_EVENT_NAME: ${{ github.event_name }}
          IZO_EVENT_SHA: ${{ github.sha }}
          IZO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IZO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          IZO_PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"

          function Test-CommitSha([string]$Sha) {
            if (-not $Sha -or $Sha -notmatch "^[0-9a-fA-F]{40}$" -or $Sha -match "^0{40}$") {
              return $false
            }
            & git cat-file -e "$Sha^{commit}" 2>$null
            return $LASTEXITCODE -eq 0
          }

          function Resolve-HeadParent([string]$HeadSha) {
            $parent = (& git rev-parse "$HeadSha^" 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or -not (Test-CommitSha $parent)) {
              throw "Unable to resolve a valid HEAD^ fallback for supply-chain range."
            }
            return $parent.ToLowerInvariant()
          }

          $eventName = $env:IZO_EVENT_NAME
          $actualHead = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actualHead -notmatch "^[0-9a-f]{40}$") {
            throw "Unable to resolve checked-out HEAD."
          }

          switch ($eventName) {
            "pull_request" {
              $expectedHead = $env:IZO_PR_HEAD_SHA
              $baseSha = $env:IZO_PR_BASE_SHA
              $baseSource = "pull_request.base.sha"
            }
            "push" {
              $expectedHead = $env:IZO_EVENT_SHA
              $before = $env:IZO_PUSH_BEFORE_SHA
              if (Test-CommitSha $before) {
                $baseSha = $before.ToLowerInvariant()
                $baseSource = "push.before"
              } else {
                $baseSha = Resolve-HeadParent $actualHead
                $baseSource = "push.before-fallback-head-parent"
              }
            }
            "workflow_dispatch" {
              $expectedHead = $env:IZO_EVENT_SHA
              $baseSha = Resolve-HeadParent $actualHead
              $baseSource = "workflow_dispatch.head-parent"
            }
            default {
              throw "Unsupported event for supply-chain range: $eventName"
            }
          }

          if (-not $expectedHead -or $expectedHead -notmatch "^[0-9a-fA-F]{40}$") {
            throw "Resolved expected event HEAD is not a valid commit SHA."
          }
          $expectedHead = $expectedHead.ToLowerInvariant()
          if ($actualHead -ne $expectedHead) {
            throw "Exact-head mismatch: expected event HEAD $expectedHead, got $actualHead"
          }
          if (-not (Test-CommitSha $baseSha)) {
            throw "Resolved supply-chain base is not a valid available commit: $baseSha"
          }
          $baseSha = $baseSha.ToLowerInvariant()

          Write-Host "SUPPLY_CHAIN_EVENT_NAME=$eventName"
          Write-Host "SUPPLY_CHAIN_EXACT_HEAD=$actualHead"
          Write-Host "SUPPLY_CHAIN_BASE_SHA=$baseSha"
          Write-Host "SUPPLY_CHAIN_BASE_SOURCE=$baseSource"
          "event_name=$eventName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "exact_head=$actualHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "base_sha=$baseSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "base_source=$baseSource" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Assert pinned local toolchain
        shell: powershell
        run: |
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $expectedPython = (Get-Content .python-version -Raw).Trim()
          $expectedNode = (Get-Content .node-version -Raw).Trim()
          $actualPython = (& $python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          $actualNode = (& $node --version).Trim().TrimStart("v")
          if ($actualPython -ne $expectedPython) {
            throw "Python version mismatch: expected $expectedPython, got $actualPython"
          }
          if ($actualNode -ne $expectedNode) {
            throw "Node version mismatch: expected $expectedNode, got $actualNode"
          }
          Write-Host "Pinned toolchain ready: python=$actualPython node=$actualNode npm=$npm"

      - name: Enforce package scope
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          IZO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m tools.agent_system.enforce --repo-root . ci --target-base $env:IZO_PR_BASE_SHA
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Enforce reviewed npm audit baseline
        id: npm_audit
        working-directory: frontend
        env:
          IZO_EXPECTED_HEAD_SHA: ${{ steps.supply_chain_range.outputs.exact_head }}
        run: |
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $auditDir = Join-Path $env:RUNNER_TEMP "supply-chain-audit"
          New-Item -ItemType Directory -Force -Path $auditDir | Out-Null
          $fullJson = Join-Path $auditDir "npm-audit-full.json"
          $productionJson = Join-Path $auditDir "npm-audit-production.json"
          $fullErr = Join-Path $auditDir "npm-audit-full.stderr.txt"
          $productionErr = Join-Path $auditDir "npm-audit-production.stderr.txt"
          $normalized = Join-Path $auditDir "npm-audit-normalized.json"
          $metadata = Join-Path $auditDir "metadata.json"

          $fullStdout = @(& $npm audit --json 2> $fullErr)
          $fullExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $fullJson,
            ($fullStdout -join [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

          $productionStdout = @(& $npm audit --omit=dev --json 2> $productionErr)
          $productionExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $productionJson,
            ($productionStdout -join [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

          $candidateHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateHead -notmatch "^[0-9a-f]{40}$") {
            throw "Unable to resolve exact candidate HEAD."
          }
          if (-not $env:IZO_EXPECTED_HEAD_SHA -or $env:IZO_EXPECTED_HEAD_SHA -notmatch "^[0-9a-f]{40}$") {
            throw "Supply-chain range resolver did not provide a valid expected HEAD."
          }
          if ($candidateHead -ne $env:IZO_EXPECTED_HEAD_SHA) {
            throw "Exact-head mismatch: expected $env:IZO_EXPECTED_HEAD_SHA, got $candidateHead"
          }

          $nodeVersion = (& $node --version).Trim()
          $npmVersion = (& $npm --version).Trim()
          $metadataPayload = [ordered]@{
            exactHead = $candidateHead
            workflowRun = [string]$env:GITHUB_RUN_ID
            workflowAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            nodeVersion = $nodeVersion
            npmVersion = $npmVersion
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
            scannerExitCodes = [ordered]@{
              full = $fullExit
              production = $productionExit
            }
          }
          [IO.File]::WriteAllText(
            $metadata,
            ($metadataPayload | ConvertTo-Json -Depth 4),
            [Text.UTF8Encoding]::new($false)
          )

          Write-Host "NPM_AUDIT_HEAD=$candidateHead"
          python ../tools/supply_chain_audit.py `
            --full-input $fullJson `
            --production-input $productionJson `
            --full-exit-code $fullExit `
            --production-exit-code $productionExit `
            --full-stderr $fullErr `
            --production-stderr $productionErr `
            --policy ../architecture/security-policy.json `
            --output $normalized


      - name: Enforce Python licenses and changed-scope secret floor
        id: supply_chain_floor
        shell: powershell
        env:
          IZO_EVENT_NAME: ${{ steps.supply_chain_range.outputs.event_name }}
          IZO_EXPECTED_HEAD_SHA: ${{ steps.supply_chain_range.outputs.exact_head }}
          IZO_SCAN_BASE_SHA: ${{ steps.supply_chain_range.outputs.base_sha }}
          IZO_SCAN_BASE_SOURCE: ${{ steps.supply_chain_range.outputs.base_source }}
        run: |
          $ErrorActionPreference = "Stop"
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $repoRoot = (Resolve-Path .).Path
          $auditDir = Join-Path $env:RUNNER_TEMP "supply-chain-audit"
          $toolRoot = Join-Path $env:RUNNER_TEMP "supply-chain-tools"
          $pyToolRoot = Join-Path $toolRoot "python"
          $npmToolRoot = Join-Path $toolRoot "npm-license"
          $gitleaksRoot = Join-Path $toolRoot "gitleaks"
          New-Item -ItemType Directory -Force -Path $auditDir, $toolRoot, $gitleaksRoot | Out-Null

          function Write-Utf8File([string]$Path, [string]$Value) {
            [IO.File]::WriteAllText($Path, $Value, [Text.UTF8Encoding]::new($false))
          }

          $pythonAudit = Join-Path $auditDir "python-audit.json"
          $pythonAuditErr = Join-Path $auditDir "python-audit.stderr.txt"
          $frontendLicenses = Join-Path $auditDir "frontend-licenses.json"
          $frontendLicensesErr = Join-Path $auditDir "frontend-licenses.stderr.txt"
          $backendLicenses = Join-Path $auditDir "backend-licenses.json"
          $backendLicensesErr = Join-Path $auditDir "backend-licenses.stderr.txt"
          $secretRaw = Join-Path $auditDir "gitleaks-changed-scope-redacted.raw.json"
          $secretErr = Join-Path $auditDir "gitleaks-changed-scope.stderr.txt"
          $secretSafe = Join-Path $auditDir "secret-scan-redacted.json"
          $floorNormalized = Join-Path $auditDir "supply-chain-floor-normalized.json"
          $metadata = Join-Path $auditDir "metadata.json"
          Write-Utf8File $pythonAudit "[]"
          Write-Utf8File $frontendLicenses "{}"
          Write-Utf8File $backendLicenses "[]"
          Write-Utf8File $secretRaw "[]"
          Write-Utf8File $secretSafe '{"status":"EXTERNAL_VERIFICATION_UNAVAILABLE","findings":[]}'
          Write-Utf8File $floorNormalized '{"policy":{"status":"FAIL","violations":["FLOOR_NOT_EVALUATED"]}}'

          $candidateHead = (& git -C $repoRoot rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $candidateHead -notmatch "^[0-9a-f]{40}$") { throw "Unable to resolve exact candidate HEAD." }
          if (-not $env:IZO_EXPECTED_HEAD_SHA -or $env:IZO_EXPECTED_HEAD_SHA -notmatch "^[0-9a-f]{40}$") { throw "Supply-chain range resolver did not provide a valid expected HEAD." }
          if ($candidateHead -ne $env:IZO_EXPECTED_HEAD_SHA) { throw "Exact-head mismatch: expected $env:IZO_EXPECTED_HEAD_SHA, got $candidateHead" }
          $eventName = $env:IZO_EVENT_NAME
          $baseSha = $env:IZO_SCAN_BASE_SHA
          $baseSource = $env:IZO_SCAN_BASE_SOURCE
          if (-not $eventName) { throw "Supply-chain range resolver did not provide eventName." }
          if (-not $baseSource) { throw "Supply-chain range resolver did not provide baseSource." }
          if (-not $baseSha -or $baseSha -notmatch "^[0-9a-f]{40}$") { throw "Supply-chain range resolver did not provide a valid base SHA." }
          & git -C $repoRoot cat-file -e "$baseSha^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Resolved supply-chain base commit is unavailable: $baseSha" }

          $pipAuditExit = 127
          $backendLicenseExit = 127
          $frontendLicenseExit = 127
          $secretExit = 127
          $syntheticExit = 127
          $syntheticStatus = "FAIL"
          $pipAuditVersion = $null
          $pipLicensesVersion = $null
          $licenseCheckerVersion = $null
          $gitleaksVersion = $null

          try {
            & $python -m venv $pyToolRoot
            if ($LASTEXITCODE -ne 0) { throw "Unable to create temporary Python scanner environment." }
            $toolPython = Join-Path $pyToolRoot "Scripts\python.exe"
            & $toolPython -m pip install --disable-pip-version-check --no-input "pip-audit==2.10.1" "pip-licenses==5.5.5"
            if ($LASTEXITCODE -ne 0) { throw "Unable to install pinned Python scanners." }
            $pipAuditVersion = ((& $toolPython -m pip_audit --version) -join " ").Trim()
            $pipLicenses = Join-Path $pyToolRoot "Scripts\pip-licenses.exe"
            $pipLicensesVersion = ((& $pipLicenses --version) -join " ").Trim()
            if ($pipAuditVersion -notmatch "2\.10\.1") { throw "Unexpected pip-audit version: $pipAuditVersion" }
            if ($pipLicensesVersion -notmatch "5\.5\.5") { throw "Unexpected pip-licenses version: $pipLicensesVersion" }

            $savedErrorAction = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              & $toolPython -m pip_audit --requirement backend/requirements.txt --format json --aliases --progress-spinner off --strict --output $pythonAudit 2> $pythonAuditErr
              $pipAuditExit = $LASTEXITCODE
              & $pipLicenses --python=$python --from=expression --format=json --output-file=$backendLicenses 2> $backendLicensesErr
              $backendLicenseExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorAction
            }
          } catch {
            Write-Utf8File $pythonAuditErr $_.Exception.Message
            Write-Utf8File $backendLicensesErr $_.Exception.Message
          }

          try {
            New-Item -ItemType Directory -Force -Path $npmToolRoot | Out-Null
            & $npm install --prefix $npmToolRoot --no-save --ignore-scripts --fund=false --audit=false "license-checker-rseidelsohn@5.0.1"
            if ($LASTEXITCODE -ne 0) { throw "Unable to install pinned frontend license scanner." }
            $licenseChecker = Join-Path $npmToolRoot "node_modules\.bin\license-checker-rseidelsohn.cmd"
            $licenseCheckerPackage = Get-Content -LiteralPath (Join-Path $npmToolRoot "node_modules\license-checker-rseidelsohn\package.json") -Raw | ConvertFrom-Json
            $licenseCheckerVersion = [string]$licenseCheckerPackage.version
            if ($licenseCheckerVersion -ne "5.0.1") { throw "Unexpected license-checker-rseidelsohn version: $licenseCheckerVersion" }
            $savedErrorAction = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              & $licenseChecker --start (Resolve-Path frontend).Path --direct true --json --out $frontendLicenses 2> $frontendLicensesErr
              $frontendLicenseExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorAction
            }
          } catch {
            Write-Utf8File $frontendLicensesErr $_.Exception.Message
          }

          try {
            $gitleaksZip = Join-Path $gitleaksRoot "gitleaks_8.30.1_windows_x64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip" -OutFile $gitleaksZip
            $gitleaksHash = (Get-FileHash -LiteralPath $gitleaksZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($gitleaksHash -ne "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e") { throw "Pinned gitleaks archive SHA256 mismatch." }
            Expand-Archive -LiteralPath $gitleaksZip -DestinationPath $gitleaksRoot -Force
            $gitleaks = Join-Path $gitleaksRoot "gitleaks.exe"
            $gitleaksVersion = ((& $gitleaks --version) -join " ").Trim()
            if ($gitleaksVersion -notmatch "8\.30\.1") { throw "Unexpected gitleaks version: $gitleaksVersion" }

            $syntheticDir = Join-Path $toolRoot "synthetic-secret"
            New-Item -ItemType Directory -Force -Path $syntheticDir | Out-Null
            $fakeSuffix = (([Guid]::NewGuid().ToString("N") + "A1b2C3D4")).Substring(0, 36)
            $fakeSecret = "gh" + "p_" + $fakeSuffix
            Write-Utf8File (Join-Path $syntheticDir "fixture.txt") ("token=" + $fakeSecret)
            $syntheticReport = Join-Path $toolRoot "synthetic-secret-report.json"
            & $gitleaks dir $syntheticDir --redact=100 --report-format json --report-path $syntheticReport --exit-code 23 --no-banner --no-color
            $syntheticExit = $LASTEXITCODE
            $syntheticText = if (Test-Path -LiteralPath $syntheticReport) { Get-Content -LiteralPath $syntheticReport -Raw } else { "" }
            if ($syntheticExit -eq 23 -and $syntheticText.Trim() -and -not $syntheticText.Contains($fakeSecret)) { $syntheticStatus = "PASS" }

            $logOpts = "$baseSha..$candidateHead"
            $savedErrorAction = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            try {
              & $gitleaks git $repoRoot --log-opts=$logOpts --redact=100 --report-format json --report-path $secretRaw --exit-code 23 --no-banner --no-color 2> $secretErr
              $secretExit = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorAction
            }
            if ($secretExit -eq 0 -and -not (Test-Path -LiteralPath $secretRaw)) { Write-Utf8File $secretRaw "[]" }
          } catch {
            Write-Utf8File $secretErr $_.Exception.Message
          }

          $npmMetadata = if (Test-Path -LiteralPath $metadata) { Get-Content -LiteralPath $metadata -Raw | ConvertFrom-Json } else { $null }
          $metadataPayload = [ordered]@{
            eventName = $eventName
            exactHead = $candidateHead
            baseSha = $baseSha
            baseSource = $baseSource
            workflowRun = [string]$env:GITHUB_RUN_ID
            workflowAttempt = [int]$env:GITHUB_RUN_ATTEMPT
            timestamp = (Get-Date).ToUniversalTime().ToString("o")
            scanners = [ordered]@{
              npmAudit = [ordered]@{ name = "npm audit"; version = if ($npmMetadata) { [string]$npmMetadata.npmVersion } else { $null } }
              pipAudit = [ordered]@{ name = "pip-audit"; expectedVersion = "2.10.1"; observedVersion = $pipAuditVersion }
              backendLicense = [ordered]@{ name = "pip-licenses"; expectedVersion = "5.5.5"; observedVersion = $pipLicensesVersion }
              frontendLicense = [ordered]@{ name = "license-checker-rseidelsohn"; expectedVersion = "5.0.1"; observedVersion = $licenseCheckerVersion }
              secretScan = [ordered]@{ name = "gitleaks"; expectedVersion = "8.30.1"; observedVersion = $gitleaksVersion; assetSha256 = "d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e" }
            }
            scannerExitCodes = [ordered]@{
              npmFull = if ($npmMetadata) { $npmMetadata.scannerExitCodes.full } else { $null }
              npmProduction = if ($npmMetadata) { $npmMetadata.scannerExitCodes.production } else { $null }
              pythonAudit = $pipAuditExit
              backendLicense = $backendLicenseExit
              frontendLicense = $frontendLicenseExit
              secretChangedScope = $secretExit
              syntheticSecret = $syntheticExit
            }
            syntheticSecretTest = $syntheticStatus
          }
          Write-Utf8File $metadata (($metadataPayload | ConvertTo-Json -Depth 8))

          & $python tools/supply_chain_floor.py `
            --python-audit $pythonAudit `
            --python-exit-code $pipAuditExit `
            --python-stderr $pythonAuditErr `
            --frontend-licenses $frontendLicenses `
            --frontend-license-exit-code $frontendLicenseExit `
            --frontend-license-stderr $frontendLicensesErr `
            --frontend-package-json frontend/package.json `
            --backend-licenses $backendLicenses `
            --backend-license-exit-code $backendLicenseExit `
            --backend-license-stderr $backendLicensesErr `
            --backend-requirements backend/requirements.txt `
            --secret-report $secretRaw `
            --secret-exit-code $secretExit `
            --secret-stderr $secretErr `
            --synthetic-secret-test $syntheticStatus `
            --policy architecture/security-policy.json `
            --output $floorNormalized `
            --secret-safe-output $secretSafe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload supply-chain evidence
        if: always() && steps.npm_audit.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-evidence-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\supply-chain-audit\npm-audit-full.json
            ${{ runner.temp }}\supply-chain-audit\npm-audit-production.json
            ${{ runner.temp }}\supply-chain-audit\npm-audit-normalized.json
            ${{ runner.temp }}\supply-chain-audit\python-audit.json
            ${{ runner.temp }}\supply-chain-audit\frontend-licenses.json
            ${{ runner.temp }}\supply-chain-audit\backend-licenses.json
            ${{ runner.temp }}\supply-chain-audit\secret-scan-redacted.json
            ${{ runner.temp }}\supply-chain-audit\supply-chain-floor-normalized.json
            ${{ runner.temp }}\supply-chain-audit\metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run deterministic repository verification
        shell: powershell
        run: |
          $env:APP_ENV = "test"
          $env:BOT_UPDATES_MODE = "disabled"
          $env:MAX_UPDATES_MODE = "disabled"
          $env:COMFYUI_REQUIRED = "false"
          $env:COMFYUI_MOCK_FALLBACK = "false"
          $env:TELEGRAM_BOT_TOKEN = ""
          $env:MAX_BOT_TOKEN = ""
          $env:OPENROUTER_API_KEY = ""
          $env:SESSION_HMAC_SECRET = ""
          $env:EMAIL_PROVIDER = ""
          $env:DATABASE_URL = Join-Path $env:RUNNER_TEMP "izo-ci.sqlite3"
          $env:MEDIA_DIR = Join-Path $env:RUNNER_TEMP "izo-ci-media"
          $env:IZO_SECRET_DIR = Join-Path $env:RUNNER_TEMP "izo-ci-secrets"
          $python = (Get-Command python.exe).Source
          $npm = (Get-Command npm.cmd).Source
          .\tools\verify.ps1 -Mode CI -PythonPath $python -NpmPath $npm

      - name: Remove temporary CI data
        if: always()
        shell: powershell
        run: |
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP "izo-ci.sqlite3"),
            (Join-Path $env:RUNNER_TEMP "izo-ci-media"),
            (Join-Path $env:RUNNER_TEMP "izo-ci-secrets"),
            (Join-Path $env:RUNNER_TEMP "supply-chain-audit"),
            (Join-Path $env:RUNNER_TEMP "supply-chain-tools")
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
