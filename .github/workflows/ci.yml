name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend, tooling and frontend gates
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor == 'spikeal8-maker'
      )
    runs-on: [self-hosted, windows, x64, izo-ci]
    timeout-minutes: 45

    steps:
      - name: Assert trusted isolated runner
        shell: powershell
        run: |
          if ($env:IZO_CI_RUNNER_TRUSTED -ne "1") {
            throw "The izo-ci runner is missing its trusted isolation marker."
          }
          if ($env:RUNNER_NAME -notlike "izo-ci-*") {
            throw "Unexpected runner identity: $env:RUNNER_NAME"
          }

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          clean: true
          fetch-depth: 2
          persist-credentials: false

      - name: Assert pinned local toolchain
        shell: powershell
        run: |
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $expectedPython = (Get-Content .python-version -Raw).Trim()
          $expectedNode = (Get-Content .node-version -Raw).Trim()
          $actualPython = (& $python -c "import sys; print('.'.join(map(str, sys.version_info[:3])))").Trim()
          $actualNode = (& $node --version).Trim().TrimStart("v")
          if ($actualPython -ne $expectedPython) {
            throw "Python version mismatch: expected $expectedPython, got $actualPython"
          }
          if ($actualNode -ne $expectedNode) {
            throw "Node version mismatch: expected $expectedNode, got $actualNode"
          }
          Write-Host "Pinned toolchain ready: python=$actualPython node=$actualNode npm=$npm"

      - name: Enforce package scope
        if: github.event_name == 'pull_request'
        shell: powershell
        env:
          IZO_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m tools.agent_system.enforce --repo-root . ci --target-base $env:IZO_PR_BASE_SHA
      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Capture fresh npm audit baseline
        working-directory: frontend
        env:
          IZO_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $auditJson = Join-Path $env:RUNNER_TEMP "npm-audit.json"
          $auditErrNative = Join-Path $env:RUNNER_TEMP "npm-audit.stderr.native.txt"
          $auditErr = Join-Path $env:RUNNER_TEMP "npm-audit.stderr.txt"
          $normalized = Join-Path $env:RUNNER_TEMP "npm-audit-normalized.json"
          $stdout = @(& $npm audit --json 2> $auditErrNative)
          $auditExit = $LASTEXITCODE
          [IO.File]::WriteAllText(
            $auditJson,
            ($stdout -join [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )
          $stderrText = if (Test-Path -LiteralPath $auditErrNative) {
            Get-Content -LiteralPath $auditErrNative -Raw
          } else {
            ""
          }
          [IO.File]::WriteAllText(
            $auditErr,
            $stderrText,
            [Text.UTF8Encoding]::new($false)
          )
          $candidateHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $candidateHead -notmatch "^[0-9a-f]{40}$") {
            throw "Unable to resolve exact candidate HEAD."
          }
          if ($env:IZO_PR_HEAD_SHA -and $candidateHead -ne $env:IZO_PR_HEAD_SHA) {
            throw "Exact-head mismatch: expected $env:IZO_PR_HEAD_SHA, got $candidateHead"
          }
          Write-Host "NPM_AUDIT_HEAD=$candidateHead"
          python ../tools/supply_chain_audit.py --input $auditJson --scanner-exit-code $auditExit --scanner-stderr $auditErr --output $normalized

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run deterministic repository verification
        shell: powershell
        run: |
          $env:APP_ENV = "test"
          $env:BOT_UPDATES_MODE = "disabled"
          $env:MAX_UPDATES_MODE = "disabled"
          $env:COMFYUI_REQUIRED = "false"
          $env:COMFYUI_MOCK_FALLBACK = "false"
          $env:TELEGRAM_BOT_TOKEN = ""
          $env:MAX_BOT_TOKEN = ""
          $env:OPENROUTER_API_KEY = ""
          $env:SESSION_HMAC_SECRET = ""
          $env:EMAIL_PROVIDER = ""
          $env:DATABASE_URL = Join-Path $env:RUNNER_TEMP "izo-ci.sqlite3"
          $env:MEDIA_DIR = Join-Path $env:RUNNER_TEMP "izo-ci-media"
          $env:IZO_SECRET_DIR = Join-Path $env:RUNNER_TEMP "izo-ci-secrets"
          $python = (Get-Command python.exe).Source
          $npm = (Get-Command npm.cmd).Source
          .\tools\verify.ps1 -Mode CI -PythonPath $python -NpmPath $npm

      - name: Remove temporary CI data
        if: always()
        shell: powershell
        run: |
          foreach ($path in @(
            (Join-Path $env:RUNNER_TEMP "izo-ci.sqlite3"),
            (Join-Path $env:RUNNER_TEMP "izo-ci-media"),
            (Join-Path $env:RUNNER_TEMP "izo-ci-secrets")
          )) {
            Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
          }
