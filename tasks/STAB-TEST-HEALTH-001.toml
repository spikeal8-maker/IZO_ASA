manifestVersion = 1
id = "STAB-TEST-HEALTH-001"
baseSha = "cf0f1db9d55205d78c81fd73eaf2d045201e0316"

goal = "Turn the accepted exact-head Slice 1 warning/cleanup baseline into a reviewed non-regression gate without remediation."

userOutcome = "Issue #112 Slice 2 fails fresh exact-head CI only when warning/cleanup health regresses beyond the accepted 97/1 baseline or reviewed debt metadata becomes invalid."

beforeScenario = "Slice 1 accepted artifact 10890620713 on ab1aab849e634918247c4a420fd6b1094ff9bb65 records 97 warnings and 1 cleanup PermissionError, but those exact records are not yet enforced against regressions."

afterScenario = "Fresh CI reuses the same single full pytest run, compares normalized warning/cleanup evidence with the accepted Slice 1 baseline, allows decreases, fails new/increased debt, validates bounded debt reviews #162-#165, and uploads exact-head evidence."

nonGoals = [
  "fix warnings",
  "fix cleanup PermissionError",
  "invent warning or cleanup tolerances beyond the accepted Slice 1 baseline",
  "add retries",
  "suppress warnings",
  "rewrite product tests",
  "change product behavior",
  "implement #113 or #115",
  "Docker work",
  "deploy or restart",
]

