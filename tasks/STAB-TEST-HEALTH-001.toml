  "invent warning or cleanup tolerances beyond the accepted Slice 1 baseline",
  "add retries",
  "add retry or socket dependencies",
  "broadly allow external network",
  "remediate provider/network callers",
  "suppress warnings",
  "rewrite product tests",
  "change product behavior",
  "implement #113 or #115",
  "Docker work",
  "deploy or restart",
]

