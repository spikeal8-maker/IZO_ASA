acceptance = [
  "Fresh exact-head CI runs the existing full verification and its existing pytest suite exactly once.",
  "The pytest invocation adds only bounded diagnostic duration reporting when test-health capture is requested.",
  "The safe artifact contains pytest-raw.log, test-health-receipt.json and metadata.json tied to exact HEAD/run/attempt.",
  "Receipt reports passed/failed/skipped/xfailed/xpassed, warning total plus normalized category/source records, cleanup error records, pytest/full-verify timing and bounded slowest durations.",
  "Retry/flaky state is NOT_OBSERVABLE or UNKNOWN unless the current runner output proves a retry count; absence is never fabricated as zero.",
  "Random temp/runner paths are normalized so identical warning/cleanup types do not create false new categories.",
  "Malformed/incomplete evidence, failed test execution, parser failure, missing evidence or exact-head mismatch fails the package.",
  "Accepted warning/cleanup debt may decrease, but new categories, count increases, total increases, missing debt review fields or expired reviews fail Slice 2.",
  "No warning suppression, cleanup remediation, retry addition, product/dependency change, #113/#115, Docker, deploy or restart occurs.",
  "Normal repository exact-head CI remains green with zero production/dependency/scope violations.",
]

requiredEvidence = [
  "tools/test_test_health_audit.py",
  "tools/test_verify_script.py",
  "tools/test_ci_workflow.py",
  "test-health-evidence exact-head GitHub Actions artifact",
  "debt Issues #162, #163, #164 and #165",
  "package enforcement receipt",
  "exact-head GitHub CI",
]

targetedTests = [
  "tools/test_test_health_audit.py",
  "tools/test_verify_script.py",
  "tools/test_ci_workflow.py",
]

fileGrowthExpectations = [
  "tools/test_health_audit.py remains a parser/normalizer only and contains no remediation or custom test-runner logic.",
  "architecture/test-health-policy.json contains the exact accepted 97/1 baseline and reviewed debt references, with no timing threshold.",
  "CI reuses the existing full verify path and does not add a second full pytest run.",
  "No production or dependency source grows.",
]

