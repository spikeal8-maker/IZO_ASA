  "The pytest invocation adds only bounded diagnostic duration reporting when test-health capture is requested.",
  "The safe artifact contains pytest-raw.log, pytest-telemetry.json, test-health-receipt.json and metadata.json tied to exact HEAD/run/attempt.",
  "Receipt reports passed/failed/skipped/xfailed/xpassed, warning total plus normalized category/source records, cleanup error records, pytest/full-verify timing and bounded slowest durations.",
  "Pytest-level rerun observability is AVAILABLE from hooks; zero rerun reports is accepted only when telemetry is present, while repeat-run nondeterminism remains NOT_MEASURED.",
  "Random temp/runner paths are normalized so identical warning/cleanup types do not create false new categories.",
  "Malformed/incomplete evidence, failed test execution, parser failure, missing evidence or exact-head mismatch fails the package.",
  "Accepted warning/cleanup debt may decrease, but new categories, count increases, total increases, missing debt review fields or expired reviews fail the implementation candidate.",
  "No warning suppression, cleanup remediation, retry addition, product/dependency change, #113/#115, Docker, deploy or restart occurs.",
  "The opt-in pytest plugin allows loopback/local IPC, blocks external getaddrinfo/create_connection/connect/connect_ex attempts before connection and records only safe target metadata.",
  "Network telemetry is AVAILABLE with zero blocked external attempts; the external allowlist baseline remains empty.",
  "Pytest rerun observability is AVAILABLE with zero rerun reports; loaded retry plugins are recorded and repeat-run nondeterminism remains NOT_MEASURED.",
  "The existing Get-PytestProcesses verification records pytestProcessLeakCheck=PASS before policy acceptance.",
  "The exact-head artifact includes pytest-raw.log, pytest-telemetry.json, test-health-receipt.json and metadata.json.",
  "Normal repository exact-head CI remains green with zero production/dependency/scope violations.",
]

