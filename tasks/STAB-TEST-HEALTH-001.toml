manifestVersion = 1
id = "STAB-TEST-HEALTH-001"
baseSha = "cf0f1db9d55205d78c81fd73eaf2d045201e0316"

goal = "Add fail-closed pytest network/rerun/process observability on top of the accepted warning/cleanup non-regression baseline without remediation."

userOutcome = "Issue #112 implementation candidate proves one full pytest run has no external outbound attempts, no pytest rerun events and no process leak while preserving the accepted warning/cleanup floor."

beforeScenario = "Slice 2 enforces the accepted 97/1 warning/cleanup floor, but pytest-level outbound network attempts and rerun events are not yet directly observable."

afterScenario = "Fresh CI reuses the same single full pytest run with an opt-in telemetry plugin, blocks and records external socket attempts before connection, observes actual rerun reports/plugins, records the existing process-leak check, preserves warning/cleanup non-regression and uploads exact-head evidence."

nonGoals = [
  "fix warnings",
