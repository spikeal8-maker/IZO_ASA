goal = "Capture a fresh exact-head machine-readable test-health baseline from the existing pytest/verify path without remediation or threshold enforcement."

userOutcome = "Issue #112 Slice 1 produces safe raw and normalized evidence for test counts, warnings, cleanup debt and timing on the exact candidate HEAD."

beforeScenario = "Main CI is green but test-health evidence exists only as console output; historical warning and cleanup counts are not a fresh machine-readable baseline."

afterScenario = "The existing full verification captures its single pytest run into a safe raw log, normalizes test/warning/cleanup/timing evidence, uploads an exact-head artifact, and leaves existing debt unenforced."

