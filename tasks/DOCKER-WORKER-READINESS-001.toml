acceptance = [
  "Keep 06914cf88dcf5574c574df559433c3a29c005b82, d6ecb7f83efda06bc64f59fbd79d86e3771c6890, 8772a1100a40e6fed22578e9571250aefda5597f and 71ac607fb497506c2056df6b806d104d695f29f5 as ancestors; preserve historical manifests and FAIL/PASS evidence in Git and the existing PRs.",
  "Canonical finish closes only clean predecessor ownership, then start creates the bounded successor from current origin/main; normal FF integration preserves the source checkpoint and one existing changed current Task manifest relative to main.",
  "The default combined DEV/Windows role remains compatible. In the split role, the API owns SQLite, migrations, admission, accounting and media finalization while a separate worker performs generation provider transport over a private bounded IPC protocol.",
  "API server role starts no in-process generation consumer. Worker role cannot start the API or import its database/runtime, and Docker workers mount only the private IPC volume, without application database or media volumes.",
  "Two actual worker processes compete for durable SQLite job leases through the single writer. One active image execution is admitted globally; duplicate wakes, the commit-to-wake gap and process-local cache cannot produce duplicate or lost execution.",
  "Persist ownership before provider dispatch, renew only the current lease, fence every terminal transition, and resolve lease/stream loss once without automatic uncertain resubmission. Real process death, restart, stale completion and concurrent claims are tested.",
  "Preserve accepted idempotent response, owner isolation, charge/refund and provider reconciliation behavior. API and factory-created Phone list/detail routes observe current durable queued/running/terminal state.",
  "Keep the existing bounded authenticated Comfy cancellation control in the API; serialize its global interrupt against admission of the next worker job. Queued cancellation cannot interrupt a foreign active job, and repeated cancellation/refund remain idempotent.",
  "Public successful /api/health retains its existing exact four-field contract. A current media write/read/fsync failure produces HTTP503, false ready/ok and only a stable safe reason code; separate liveness stays HTTP200 and restored readiness returns HTTP200 on the same running container.",
  "Media probing performs a bounded exclusive temporary one-byte operation, does not modify existing files or directory permissions, creates at most one in-flight probe and retains no backup-visible temporary file.",
  "Run all unchanged D1-01 through D1-08 checks across three fresh installations on each of two separately provisioned GitHub-hosted VMs using the real split role, exact source/image/config identities and the existing bounded controlled provider.",
  "Preserve D2 crash/idempotency/cancel, backup/restore/damaged-copy/media financial checks and their strict DB, migration, media and foreign-resource equality conditions. Treat the new IPC volume as explicitly owned temporary control state, not backup data.",
  "Register the actual new background tasks and role lifecycle in architecture/contract.json; all unrelated contract keys, provider entries, file/symbol limits and security/test-health policy stay unchanged. Generated inventories are regenerated only with their existing tools.",
  "Exact-head Full CI, fresh Docker evidence, clean scope/hygiene/secret checks and independent review precede any merge decision. Preserve every failed attempt; do not push while an applicable Full run is active or queued.",
  "D3 evidence remains a finite explicit functional matrix. Test provider protocol success is not real model or target-capacity proof; complete D2 before proceeding with the remaining D3 work, then consider merge and permanent installation.",
]
