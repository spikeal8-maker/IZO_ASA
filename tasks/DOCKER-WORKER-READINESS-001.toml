baseSha = "d1ee3a0ac5114ec08f4a8daee9cf6e41e97d6a7a"
goal = "Close D2-03 through a real separate generation execution role and repair the observed D2-06 media readiness defect, preserving the exact 06914cf candidate and all 48 D1 acceptance checks before proceeding to D3."
userOutcome = "The accepted application can run API and competing generation workers separately: durable ownership prevents duplicate provider execution, a lost worker reaches one fenced financial outcome, media failure is visible immediately and recovery requires no process restart."
beforeScenario = "At clean 06914cf88dcf5574c574df559433c3a29c005b82, Full run 39112074029 passes and Docker run 39112070960 proves 48 D1 checks across six fresh installs, but D2-03 remains partial because the consumer is in-process and D2-06 reports health HTTP 200 during media write failure. The extended aggregate FAIL and all original artifacts remain preserved in PR193."
afterScenario = "A canonical successor keeps the reviewed ancestry and original evidence, uses two real worker processes with a durable single-writer lease boundary, proves role, cancellation and lost-execution behavior, reports media readiness failures safely, and repeats D1 on the final images. D3 remains separately measured and is not inferred from a green D2 result."
