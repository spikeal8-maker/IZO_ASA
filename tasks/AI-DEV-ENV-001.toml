manifestVersion = 1
id = "AI-DEV-ENV-001"
baseSha = "89d6d94093fdb6d2a52cacd269e15fce342a155a"
goal = "Create a deterministic isolated per-package environment contract and lifecycle for DB, media, secrets, provider policy, owned loopback port leases, state transitions and machine-readable receipts."
userOutcome = "An active agent package can plan, activate, inspect, stop and explicitly recover its isolated environment without starting backend/frontend/providers or touching foreign resources."
beforeScenario = "AI-DEV-ENV-001 is active in docs/NOW.md but no canonical isolated package-environment planner or receipt contract exists."
afterScenario = "The active package owns <worktree>/.runtime/agent-env/<PACKAGE_ID>, can reserve deterministic loopback ports with a verifiable lease holder, report active/stale/stopped state, cooperatively stop only its own holder, and explicitly recover safe stale state."
nonGoals = [
  "start backend or frontend",
  "start any application listener on reserved ports",
  "kill foreign or guessed processes",
  "probe providers",
  "create real credentials",
  "implement Docker",
  "implement AI-VERIFY-001",
  "change product/runtime/dependency code",
]
