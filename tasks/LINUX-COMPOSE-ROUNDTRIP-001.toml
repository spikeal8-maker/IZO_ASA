  "Reject true, null, numeric zero, omitted bind objects, empty command arrays, unknown keys, changed paths or mount permissions, image/source drift, extra ports or egress, and all unsupported differences",
  "Preserve acceptance of the old exact JSON shape when the supported version is explicitly supplied; preserve render-only CLI behavior without a version argument",
  "Require --compose-version with --check-compose, reject check-only flags without an effective check, and retain fail-closed raw effective-file hash validation",
