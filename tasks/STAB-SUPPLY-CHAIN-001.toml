  "Parser tests cover clean output, high/critical findings, boolean/object fixAvailable, malformed JSON, scanner unavailable, and nonzero vulnerability-report exit behavior.",
  "Historical 0 critical / 4 high / 1 moderate / 0 low evidence is never encoded as the fresh baseline.",
