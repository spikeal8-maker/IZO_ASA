  "Default guard renders the identical canonical nft policy and retains non-root/capability/readback checks",
  "Opt-in guard permits only fixed proxy UID 10002 to one validated private IPv4 and TCP port; backend UID 10001 and web UID 101 retain direct-egress denial",
  "Proxy shares only the guard network namespace, has no published host port and no application data/media/secret mounts, and runs with all capabilities dropped",
  "Proxy pins the upstream and rejects CONNECT, absolute URLs, redirects, alternate upstreams, duplicate/invalid framing, unauthorized methods/paths and excessive bodies",
  "Global interrupt/free and management APIs remain denied in every mode; no request is forwarded for a rejected operation",
  "Read-only capability mode performs no generation; accepted generation mode never permits mock fallback",
  "History/media responses are restricted to a stable deployment namespace, including after proxy restart, without a second queue or financial ledger",
