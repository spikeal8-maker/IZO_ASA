manifestVersion = 1
id = "LINUX-COMFY-BRIDGE-001"
baseSha = "bd0a8132b8779f8589e1f8ee9f440689573d79ca"
goal = "Add an opt-in, instance-scoped ComfyUI bridge for the existing native 1Panel Linux deployment while preserving the closed default bundle."
userOutcome = "The closed Linux test application can reach the verified H-04 ComfyUI through a constrained proxy, without direct backend egress or global provider control."
beforeScenario = "Linux reaches 192.168.1.112:8188, but the accepted guard denies application egress; directly permitting backend traffic would also expose global interrupt/free and unrelated provider media."
afterScenario = "A separate non-root proxy service reuses the exact guard image and namespace; only its fixed UID can reach one configured private IPv4:port, and its protocol policy admits accepted requests and instance-owned results."
