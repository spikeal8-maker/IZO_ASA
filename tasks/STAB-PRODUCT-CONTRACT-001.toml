acceptance = [
  "Canonical handwritten source is architecture/product-flows.json with version 1 and deterministic generated JSON/Markdown projections.",
  "Generator validates root/flow schema, unknown keys, duplicate/invalid ids, owner and related domains against docs/generated/context-index.json, capability state, repository paths, endpoint methods, and evidence-or-gap requirements.",
  "Generator performs no broad repository scan and supports deterministic write plus --check drift detection.",
  "Verification includes product_flow_map_check and tools/test_product_flows.py without changing existing live-check semantics.",
  "TEST_PLAN.md points to the canonical machine-readable source and generated readable map without duplicating the contract.",
  "Final Issue #110 coverage includes register/login/session refresh/logout, Telegram trusted entry, MAX trusted entry, text-to-image, image-to-image/edit/paint, generation job lifecycle/cancel/recovery/result, gallery result/detail/download/delete/favorite/use-as, publish/feed visibility, billing checkout/payment state/token accounting, chat request/tools/billing/history, video submission/result/history, audio/transcription, admin model/economics critical operations, and admin/auth-sensitive operations.",
  "Any 3D entry, if added later, states capability DISABLED / CONTRACT-ONLY and does not claim a production generation flow.",
  "Every final critical flow links to existing canonical context domains, bounded source/frontend paths, explicit durable outcomes/side effects, user-significant failure states, and real automated evidence or an explicit coverage gap.",
  "Slice 1 contains only foundation plus auth-session-lifecycle, telegram-trusted-entry, max-trusted-entry, and text-to-image-generation; later flows remain for later slices in the same Draft PR.",
  "Production files remain zero; no provider call, deploy, restart, Docker, release or production-data mutation occurs.",
  "Package enforcement, focused tests, generated drift check, git diff check and exact-head CI pass.",
]
requiredEvidence = [
  "product-flow generator --check",
  "tools/test_product_flows.py",
