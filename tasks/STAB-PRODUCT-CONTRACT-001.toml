manifestVersion = 1
id = "STAB-PRODUCT-CONTRACT-001"
baseSha = "f5206f7eb6f5928a34fcc88a6351ed15680b2a48"
goal = "Create one canonical machine-readable contract for critical IZO_ASA user flows, with deterministic validation/generated maps and explicit linkage of every critical flow to real automated evidence."
userOutcome = "Before changing or decomposing part of IZO_ASA, an agent can determine which critical user flows use it and which automated tests must pass."
beforeScenario = "Critical user flows are distributed across source, context cards, tests and runbooks without one deterministic machine-readable map tying user surface to trust boundary, API/service, durable state and automated evidence."
afterScenario = "architecture/product-flows.json is the single handwritten critical-flow source of truth, deterministic generated JSON/Markdown are current, verification checks drift, and the full Issue #110 target flow set can be incrementally completed in one package/PR."
nonGoals = [
  "change product behavior",
  "modify backend or frontend production source",
  "modify existing product tests",
  "change database schema or media",
  "implement Docker or release changes",
  "deploy or restart runtime",
  "call production providers",
  "change docs/NOW.md",
  "start STAB-SUPPLY-CHAIN-001 issue #111",
]
declaredFiles = [
  "tasks/STAB-PRODUCT-CONTRACT-001.toml",
  "architecture/product-flows.json",
