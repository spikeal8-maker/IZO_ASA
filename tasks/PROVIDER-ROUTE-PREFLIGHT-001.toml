goal = "Implement an isolated, deterministic, fail-closed provider capability and price preflight for future backend registry routing without any runtime/network/financial side effects."
userOutcome = "A compatible ordered route can be identified from trusted backend state while disabled, unverified, unavailable, unauthorized, overpriced, or stale provider/model choices are rejected before dispatch."
