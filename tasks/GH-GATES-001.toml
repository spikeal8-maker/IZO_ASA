  "GitHub settings, ruleset, actions allowlist or token permission relaxation",
  "Deployment, live providers, production media or server changes",
]
domain = "verification"
riskClass = "high-assurance"
changeClass = "implementation"
declaredFiles = [
  ".github/workflows/ci.yml",
  ".github/workflows/file-hygiene.yml",
  "tools/test_required_workflow_gates.py",
  "tasks/GH-GATES-001.toml",
]
allowedPatterns = []
protectedFilesTouched = []
maxProductionFiles = 2
maxChangedLines = 360
acceptance = [
  "Named CI and hygiene job contexts remain unchanged and have no job-level conditional skip.",
  "Both pull_request workflows trigger for any path targeting main; push and manual events retain coverage.",
  "Untrusted/fork PRs fail explicitly before checkout instead of being SKIPPED and do not execute supplied code.",
  "Owner PRs run their original full check sequence with exact SHA and read-only permissions.",
