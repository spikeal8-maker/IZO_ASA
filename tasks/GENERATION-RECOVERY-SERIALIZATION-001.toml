baseSha = "bf2d60b508da4e4de52905561b8db0a9f27ea721"
goal = "Serialize the already wired generation-recovery read/refund/update transaction before its first read, preventing competing recovery callers from refunding the same interrupted job more than once."
userOutcome = "Concurrent startup recovery of the same persisted interrupted generation credits its owner once while preserving caller-owned commit and rollback."
beforeScenario = "Current main bf2d60b508da4e4de52905561b8db0a9f27ea721 delegates startup reconciliation to generation_recovery.py, whose initial reads precede any writer reservation; competing connections can all observe a missing refund before updating the balance and ledger."
afterScenario = "The service acquires or safely upgrades a SQLite write transaction before reading recovery state, or fails before invoking refunds; committed competing calls observe the prior recovery and become no-ops."
