  "Provide POST /api/generate admission idempotency or global idempotency for direct refund_generation_tokens callers",
  "Fence restored historical jobs, outboxes, background handlers or every user request",
  "Change main.py, database schema, migrations, global connection policy, authentication, providers or runtime configuration",
  "Start a historical database, build or deploy the application, authenticate users, generate images or switch the public site",
]
