acceptance = [
  "Provider-neutral backend and frontend contracts contain no IZO page imports and DeepSeek is the only new text provider.",
  "DeepSeek key is encrypted outside the repository per trusted user and is never returned by an API.",
  "DeepSeek connection test and current model selection are available from the chat UI.",
  "DeepSeek answers stream incrementally through a normalized transport and can be stopped and retried.",
  "The renderer safely supports text, bold, italic, lists, links, inline code, fenced code with Copy, and images without dangerouslySetInnerHTML.",
  "generate_image is exposed as the only portable chat tool in this package and IZO image jobs render requested/running/done/error inline.",
  "OpenRouter, Pulse AI, voice, RAG and web search receive no new implementation.",
  "Portability documentation defines exactly which files move to asa-lab and which IZO adapters do not.",
