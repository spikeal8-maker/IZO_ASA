manifestVersion = 1
id = "CHAT-DEEPSEEK-001"
baseSha = "f63d596f1ccae432378f431a1d4eaab41ab81308"
goal = "Deliver the first working portable AI-chat vertical with a provider-neutral core and DeepSeek as the first provider."
userOutcome = "A trusted user can save and verify their own DeepSeek API key, choose a current DeepSeek model, stream a formatted answer, stop or retry it, and generate an image from a chat tool request."
beforeScenario = "The existing chat surface is coupled to the phone-chat API and non-streaming Ollama/OpenRouter routing; it has no per-user DeepSeek key, portable runtime, stop/retry stream, or complete safe renderer."
afterScenario = "DeepSeek runs through a portable provider/runtime/renderer boundary, while IZO-specific history and image jobs remain thin shell adapters that can be replaced when the core moves to asa-lab."
nonGoals = [
  "connect or modify OpenRouter",
  "connect Pulse AI",
  "implement voice",
  "implement RAG",
  "implement web search",
  "build a large admin panel",
  "migrate legacy pages",
  "redesign billing",
  "change the DB schema",
  "change Docker or deploy",
]
