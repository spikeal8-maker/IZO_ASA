manifestVersion = 1
id = "STAB-CREDENTIAL-ISOLATION-REPAIR-001"
baseSha = "f18e9f23f9c91b1561522a7ea9d42eb23087abe8"
goal = "Add a reproducible Linux Docker sandbox launcher for ordinary IZO coding agents that is physically isolated from Windows GitHub write credentials."
userOutcome = "Ordinary coding-agent work runs in a package-owned Linux sandbox with only the package worktree and the dedicated read-only IZO SSH identity exposed."
beforeScenario = "The shared Windows user exposes a global gh OAuth credential with repo scope, so process-environment cleanup cannot guarantee a bot-safe coding context."
afterScenario = "The canonical agent CLI can build/run/probe a pinned Linux sandbox whose automatic boundary proof rejects Windows/owner credentials, denies unauthenticated HTTPS private access, allows read-only SSH access, and proves server-side push denial."
nonGoals = [
  "AI-SYMBOL-CONTEXT-001",
  "frontend or backend product changes",
  "production deployment or restart",
  "provider/network topology changes",
  "Docker DEV/TEST application environment",
  "closing issue 139 or activating issue 108",
]
declaredFiles = [
  "tools/agent.ps1",
  "tools/agent_system/sandbox.py",
  "tools/test_agent_sandbox.py",
  "tools/verify.ps1",
  "tools/test_verify_script.py",
  "ops/docker/agent-sandbox/Dockerfile",
  "ops/docker/agent-sandbox/entrypoint.sh",
  "ops/docker/agent-sandbox/boundary-probe.sh",
]
allowedPatterns = [
]
forbiddenPatterns = [
  "backend/**",
  "frontend/**",
  "docs/**",
  ".github/**",
  "architecture/**",
]
protectedFilesTouched = [
]
domain = "agent-control-plane"
riskClass = "high-assurance"
changeClass = "architecture"
maxProductionFiles = 0
maxChangedLines = 1000
acceptance = [
  "Canonical agent CLI can build, run, and probe the sandbox from an active package worktree.",
  "Sandbox does not mount the Windows user profile, Credential Manager, gh config, or owner/integration credentials.",
  "GH_TOKEN and GITHUB_TOKEN are absent inside the sandbox and gh owner auth is unavailable.",
  "Unauthenticated HTTPS access to the private IZO repository fails.",
  "SSH read/fetch through the dedicated read-only deploy key succeeds.",
  "git push --no-verify --dry-run is denied server-side by the read-only key.",
  "Existing package/worktree/registry ownership semantics remain unchanged.",
]
requiredEvidence = [
