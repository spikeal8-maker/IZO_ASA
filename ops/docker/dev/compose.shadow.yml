# Opt-in overlay. The accepted DEV configuration remains network-disabled.
# Use tools/docker_shadow.py for ownership-checked lifecycle.
services:
  guard:
    build:
      context: ../../..
      dockerfile: ops/docker/dev/Dockerfile.guard
      args:
        IZO_SOURCE_SHA: ${IZO_SOURCE_SHA:?IZO_SOURCE_SHA is required}
    image: izo-asa-shadow-guard:${IZO_SOURCE_SHA}
    user: "0:0" # Initializer drops to UID 10001 before readiness; apps cannot start earlier.
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 16
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    networks: [shadow]
    ports:
      - "127.0.0.1:${IZO_SHADOW_API_PORT:?shadow API port required}:8000"
      - "127.0.0.1:${IZO_SHADOW_WEB_PORT:?shadow web port required}:8080"
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
      io.izo.project: ${IZO_COMPOSE_PROJECT}
    healthcheck:
      test: [CMD, setpriv, --reuid=10001, --regid=10001, --clear-groups, python, -c, "from pathlib import Path; assert Path('/tmp/shadow-network-ready').read_text() == 'NO_DEFAULT_ROUTE_NONROOT'; assert not any(r.split()[1] == '00000000' for r in Path('/proc/net/route').read_text().splitlines()[1:]); assert 'CapEff:\t0000000000000000' in Path('/proc/1/status').read_text()"]
      interval: 2s
      timeout: 2s
      retries: 20
    stop_grace_period: 2s

  backend:
    network_mode: service:guard
    depends_on:
      guard:
        condition: service_healthy
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
    environment:
      TRUSTED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${IZO_SHADOW_WEB_PORT},http://localhost:${IZO_SHADOW_WEB_PORT}
      COMFYUI_BASE_URL: http://127.0.0.1:1
      OLLAMA_BASE_URL: http://127.0.0.1:1
      QWEN_ASR_BASE_URL: http://127.0.0.1:1
      LOCAL_LTX_COMFYUI_BASE_URL: http://127.0.0.1:1
      COMFYUI_MOCK_FALLBACK: "true"
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3))['ok']"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    stop_grace_period: 30s

  web:
    build:
      context: ../../..
      dockerfile: ops/docker/dev/Dockerfile.web
      args:
        IZO_SOURCE_SHA: ${IZO_SOURCE_SHA:?IZO_SOURCE_SHA is required}
    image: izo-asa-shadow-web:${IZO_SOURCE_SHA}
    user: "101:101"
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    network_mode: service:guard
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
      io.izo.project: ${IZO_COMPOSE_PROJECT}
    depends_on:
      guard:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 4s
      retries: 20
    stop_grace_period: 15s

networks:
  shadow:
    # No external route is retained by guard. Internal bridges on Docker
    # Desktop suppress port publishing, so ingress uses a guarded namespace.
    internal: false
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
      io.izo.project: ${IZO_COMPOSE_PROJECT}

volumes:
  sqlite-data:
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
  media-data:
    labels:
      io.izo.owner: SHADOW-TOPOLOGY-01
