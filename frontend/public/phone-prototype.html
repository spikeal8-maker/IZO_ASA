<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>ИЗО АСА</title>
<style>
:root,[data-mode="dark"]{
 --bg:#08090E;--s1:#0E1117;--s2:#171B23;--s3:#232936;--edge:rgba(255,255,255,.08);--edge2:rgba(255,255,255,.15);
 --tx:#fff;--tx2:#A8AFBC;--tx3:#767E8C;--act:#B822C6;--act2:#6D4AFF;--quiet:#EE86FB;
 --glow:rgba(184,34,198,.55);--day:#FFC94A;--canvas:#2B2B2B;
 --glass:rgba(20,24,32,.78);--hair:rgba(255,255,255,.16);--drop:0 20px 44px -22px rgba(0,0,0,.9);
 --prompt-glass:rgba(14,17,23,.68);--prompt-field:rgba(35,41,54,.58);--prompt-control:rgba(35,41,54,.54);--prompt-border:rgba(255,255,255,.13)}
[data-mode="light"]{
 --bg:#F6F7FB;--s1:#FFFFFF;--s2:#EEF0F6;--s3:#E2E6EF;--edge:rgba(18,19,26,.1);--edge2:rgba(18,19,26,.18);
 --tx:#12131A;--tx2:#454B59;--tx3:#5F6674;--act:#A21CAF;--act2:#6D4AFF;--quiet:#8E1897;
 --glow:rgba(162,28,175,.35);--day:#B45309;--canvas:#2B2B2B;
 --glass:rgba(255,255,255,.86);--hair:rgba(255,255,255,.95);--drop:0 18px 40px -20px rgba(18,19,26,.45);
 --prompt-glass:rgba(255,255,255,.72);--prompt-field:rgba(238,240,246,.72);--prompt-control:rgba(226,230,239,.68);--prompt-border:rgba(18,19,26,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#04050A;color:#fff;font-family:-apple-system,system-ui,"SF Pro Display","Segoe UI",Roboto,sans-serif;line-height:1.35;-webkit-font-smoothing:antialiased}
.ph{width:390px;max-width:100%;height:min(820px,86vh);border-radius:44px;overflow:hidden;overflow:clip;position:relative;
 background:var(--bg);color:var(--tx);font-family:inherit;box-shadow:0 50px 90px -50px #000,0 0 0 1px rgba(255,255,255,.08)}

/* ШАПКА */
.head{position:absolute;top:0;left:0;right:0;z-index:8;padding-bottom:8px;transition:padding .2s;
 background:linear-gradient(to bottom,var(--bg) 46%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.top{display:flex;align-items:center;gap:7px;padding:14px 10px 10px;flex-wrap:nowrap}
.mk{display:flex;align-items:center;gap:7px;flex:0 0 auto;min-width:0;white-space:nowrap;color:var(--tx);text-decoration:none}
.mk .brand-bolt{width:27px;height:27px;border-radius:9px;position:relative;display:grid;place-items:center;flex:0 0 auto;
 background:linear-gradient(150deg,var(--act),var(--act2));box-shadow:0 7px 18px -7px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.mk .brand-bolt svg{width:15px;height:18px;display:block;fill:#fff;stroke:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.22))}
.mk b{font:820 13.5px/1 inherit;letter-spacing:-.04em;white-space:nowrap;color:var(--tx)}
.seg{display:flex;gap:10px;background:transparent;padding:0;box-shadow:none;flex:0 0 auto}
.seg button{border:0;border-radius:0;padding:7px 1px;font:700 11px/1 inherit;cursor:pointer;background:transparent;
 color:var(--tx2);white-space:nowrap;position:relative}
.seg button+button::before{display:none}
.seg button[aria-pressed="true"]{background:transparent;color:var(--tx)}
.seg button[aria-pressed="true"]::after{content:"";position:absolute;left:1px;right:1px;bottom:1px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--act),var(--act2))}
.you{margin-left:auto;display:flex;align-items:center;gap:7px;height:32px;padding:0 3px 0 9px;border-radius:999px;flex:0 0 auto;
 background:var(--s2);box-shadow:inset 0 0 0 1px var(--edge);cursor:pointer}
.you i{display:flex;align-items:center;gap:4px;font-style:normal}
.you i svg{width:12px;height:12px;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.you i b{font:750 11px/1 inherit}
.you .d svg{stroke:var(--day)}.you .d b{color:var(--day)}
.you .m svg{stroke:var(--quiet)}.you .m b{color:var(--tx)}
.you img{width:26px;height:26px;border-radius:50%;object-fit:cover;display:block}

/* ВКЛАДКИ — таблетки */
.tabrow{display:flex;align-items:flex-start;gap:6px;max-height:44px;opacity:1;overflow:hidden;
 transform-origin:top;transition:max-height .22s,opacity .18s,transform .22s}
.tabwrap{flex:1;min-width:0;overflow:hidden}
.tabs{display:flex;gap:6px;padding:0 12px 6px;max-height:44px;transform-origin:top;overflow-x:auto;scroll-behavior:smooth;
 scroll-snap-type:x proximity;scroll-padding-left:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs::after{content:"";flex:0 0 1px}
.tabs button{flex:0 0 auto;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;scroll-snap-align:start;
 font:700 11.5px/1 inherit;background:transparent;color:var(--tx2);transition:.16s;position:relative;display:inline-flex;align-items:center;gap:6px}
.tabs button .ti{width:14px;height:14px;display:grid;place-items:center;flex:0 0 14px;opacity:.92}
.tabs button .ti svg{width:14px;height:14px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button .tl{display:block}
.tabs button+button::before{content:"";position:absolute;left:-2px;top:22%;bottom:22%;width:1px;background:var(--edge2)}
.tabs button[aria-selected="true"],.tabs button[aria-selected="true"]+button{}
.tabs button[aria-selected="true"]::before,.tabs button[aria-selected="true"]+button::before{display:none}
.tabs button[aria-selected="true"]{background:linear-gradient(150deg,var(--act),var(--act2));color:#fff;
 box-shadow:0 5px 12px -8px var(--glow),inset 0 1px 0 rgba(255,255,255,.26)}
.head.hide{padding-bottom:0}
.head.hide .tabrow{max-height:0;opacity:0;transform:translateY(-8px);pointer-events:none}

.body{position:absolute;inset:0;overflow-y:auto;padding:112px 14px 0;touch-action:pan-y;transition:padding-top .22s}
.head.hide + .body{padding-top:64px}
.body::-webkit-scrollbar{width:0}
.body.gen{padding-bottom:0}
.mas{columns:2;column-gap:9px}
.card{break-inside:avoid;margin-bottom:9px;border-radius:20px;overflow:hidden;position:relative;
 box-shadow:0 0 0 1px var(--edge),0 14px 28px -20px rgba(0,0,0,.85)}
.card img{width:100%;display:block}
.gal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.gal span{border-radius:14px;overflow:hidden;display:block;box-shadow:0 0 0 1px var(--edge)}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;display:block}

/* ЭКРАН КАРТИНКИ — всё на одном экране */
.gen{display:flex;flex-direction:column;gap:14px}
.canvas{background:var(--canvas);border-radius:22px;display:grid;place-items:center;overflow:hidden;position:relative;
 box-shadow:0 0 0 1px var(--edge),0 20px 40px -26px #000;max-height:44vh}
.canvas .ph-t{color:#fff;font:600 12.5px/1.45 inherit;text-align:center;padding:0 30px;opacity:.85}
.canvas .drop-t{display:grid;place-items:center;gap:10px}
.canvas .drop-t .b{border:0;border-radius:13px;padding:11px 16px;font:750 12.5px/1 inherit;color:#fff;
 background:linear-gradient(150deg,var(--act),var(--act2));box-shadow:0 10px 22px -12px var(--glow);cursor:pointer}
.canvas .clear{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;
 background:rgba(6,7,10,.6);color:#fff;display:grid;place-items:center;backdrop-filter:blur(10px)}
.canvas .clear svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.thumbchip{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:12px;padding:6px 10px 6px 6px;
 margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--edge);width:fit-content}
.thumbchip img{width:28px;height:28px;border-radius:8px;object-fit:cover;display:block}
.thumbchip b{font:700 11px/1 inherit;color:var(--tx2)}
.canvas .spark{display:block;font-size:24px;margin-bottom:10px;filter:drop-shadow(0 0 14px var(--glow))}
.canvas img{width:100%;height:100%;object-fit:contain;display:block}
.four{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.four .g{aspect-ratio:1}
.four .g{border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 0 0 1px var(--edge);position:relative}
.four .g.sel{box-shadow:0 0 0 2px var(--act),0 10px 22px -14px var(--glow)}
.four .g img{width:100%;height:100%;object-fit:cover;display:block}
.stagehdr{display:flex;align-items:center;gap:8px;margin:2px 2px -4px}
.stagehdr b{font:750 13px/1 inherit;letter-spacing:-.02em}
.stagehdr span{margin-left:auto;font:700 10.5px/1 inherit;color:var(--tx3)}
.secline{display:flex;align-items:baseline;margin:0 2px -6px}
.secline b{font:750 12px/1 inherit;letter-spacing:-.02em}
.secline span{margin-left:auto;font:700 11px/1 inherit;color:var(--quiet);cursor:pointer}
.styles{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.styles::-webkit-scrollbar{display:none}
.style{flex:0 0 auto;width:64px;cursor:pointer;border:0;background:none;padding:0}
.style .im{width:64px;height:64px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--edge)}
.style .im img{width:100%;height:100%;object-fit:cover;display:block}
.style[aria-pressed="true"] .im{box-shadow:0 0 0 2px var(--act),0 8px 18px -12px var(--glow)}
.style span{display:block;font:700 9.5px/1.25 inherit;color:var(--tx2);text-align:center;margin-top:7px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.style[aria-pressed="true"] span{color:var(--tx)}
/* ЗВУК */
.sbox{background:var(--s1);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px var(--edge)}
.sbox.empty{display:grid;place-items:center;gap:12px;min-height:150px;text-align:center}
.sbox.empty .t2{font:600 12.5px/1.45 inherit;color:var(--tx2);padding:0 18px}
.sbox.empty .sp2{font-size:22px;filter:drop-shadow(0 0 12px var(--glow))}
.wavebox{display:flex;align-items:center;gap:12px}
.pbtn{width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;
 background:linear-gradient(150deg,var(--act),var(--act2));box-shadow:0 12px 24px -12px var(--glow)}
.pbtn svg{width:18px;height:18px;fill:#fff;stroke:none;margin-left:2px}
.wf{flex:1;height:52px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wf i{flex:1;border-radius:2px;background:var(--s3)}
.wf i.p{background:linear-gradient(180deg,var(--quiet),var(--act))}
.tmr{font:750 12px/1 inherit;color:var(--tx2);flex:0 0 auto}
.segs{display:flex;gap:5px;background:var(--s2);border-radius:13px;padding:4px;box-shadow:inset 0 0 0 1px var(--edge)}
.segs button{flex:1;border:0;background:none;color:var(--tx2);border-radius:10px;padding:10px 6px;font:700 12px/1 inherit;cursor:pointer}
.segs button[aria-pressed="true"]{background:linear-gradient(150deg,var(--act),var(--act2));color:#fff;
 box-shadow:0 6px 14px -8px var(--glow)}
.voices{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.voices::-webkit-scrollbar{display:none}
.vc{flex:0 0 auto;width:96px;border:0;cursor:pointer;background:var(--s2);border-radius:16px;padding:11px 9px;
 box-shadow:inset 0 0 0 1px var(--edge);color:var(--tx);text-align:center}
.vc[aria-pressed="true"]{box-shadow:0 0 0 1.8px var(--act),0 10px 22px -14px var(--glow)}
.vc .ava2{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;
 background:var(--s3);color:var(--quiet);font:750 14px/1 inherit}
.vc[aria-pressed="true"] .ava2{background:linear-gradient(150deg,var(--act),var(--act2));color:#fff}
.vc b{display:block;font:750 11.5px/1.2 inherit}
.vc span{display:block;font:600 9.5px/1.3 inherit;color:var(--tx3);margin-top:3px}
.vc .prev{margin-top:8px;display:inline-flex;align-items:center;gap:4px;font:700 9px/1 inherit;color:var(--quiet)}
.vc .prev svg{width:9px;height:9px;fill:currentColor;stroke:none}
.moods{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px}
.moods::-webkit-scrollbar{display:none}
.md{flex:0 0 auto;width:82px;border:0;background:none;padding:0;cursor:pointer}
.md .im3{width:82px;height:82px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--edge);position:relative}
.md .im3 img{width:100%;height:100%;object-fit:cover;display:block}
.md .im3::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.5))}
.md[aria-pressed="true"] .im3{box-shadow:0 0 0 2px var(--act),0 10px 22px -14px var(--glow)}
.md b{display:block;font:700 10px/1.3 inherit;color:var(--tx2);margin-top:6px;text-align:center}
.md[aria-pressed="true"] b{color:var(--tx)}
.slider2{background:var(--s2);border-radius:16px;padding:13px;box-shadow:inset 0 0 0 1px var(--edge)}
.slider2 .r3{display:flex;align-items:baseline;margin-bottom:10px}
.slider2 .r3 b{font:750 12px/1 inherit}
.slider2 .r3 span{margin-left:auto;font:750 12px/1 inherit;color:var(--quiet)}
.track3{height:5px;border-radius:99px;background:var(--s3);position:relative;margin-bottom:8px}
.track3 i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--act),var(--act2))}
.track3 em{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;
 background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.scale3{display:flex;justify-content:space-between;font:700 9.5px/1 inherit;color:var(--tx3)}
.lens{display:flex;gap:6px}
.lens button{flex:1;border:0;border-radius:11px;padding:10px 6px;font:700 11.5px/1 inherit;cursor:pointer;
 background:var(--s2);color:var(--tx2);box-shadow:inset 0 0 0 1px var(--edge)}
.lens button[aria-pressed="true"]{background:var(--s3);color:var(--tx);box-shadow:inset 0 0 0 1.6px var(--act)}
/* ВИДЕО */
.player{position:relative;background:var(--canvas);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px var(--edge),0 20px 40px -26px #000}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.player .shade2{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.55))}
.player .mid{position:absolute;inset:0;display:grid;place-items:center;gap:9px;text-align:center;padding:0 26px}
.player .mid .t{color:#fff;font:600 12.5px/1.45 inherit;opacity:.9}
.player .big{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
 background:rgba(255,255,255,.16);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.player .big svg{width:22px;height:22px;fill:#fff;stroke:none;margin-left:3px}
.player .tl{position:absolute;left:12px;right:12px;bottom:11px}
.player .bar2{height:3px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin-bottom:7px}
.player .bar2 i{display:block;height:100%;width:38%;background:#fff}
.player .row2{display:flex;align-items:center;gap:8px;font:700 10px/1 inherit;color:#fff}
.player .row2 .sp{margin-left:auto;display:flex;gap:6px}
.player .chipx{background:rgba(6,7,10,.55);padding:5px 7px;border-radius:7px;backdrop-filter:blur(10px)}
.stagebox{background:var(--s1);border-radius:18px;padding:13px;box-shadow:inset 0 0 0 1px var(--edge)}
.stagebox .hd2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stagebox .hd2 b{font:750 13px/1 inherit}
.stagebox .hd2 span{margin-left:auto;font:700 11px/1 inherit;color:var(--quiet)}
.steps{display:flex;gap:5px;margin-bottom:10px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--s3)}
.steps i.on{background:linear-gradient(90deg,var(--act),var(--act2))}
.steps i.now{background:linear-gradient(90deg,var(--act),var(--act2));opacity:.45}
.stagebox p{font:600 11px/1.4 inherit;color:var(--tx3);margin-bottom:10px}
.stagebox .mini2{display:flex;gap:7px}
.stagebox .mini2 button{flex:1;border:0;border-radius:12px;padding:11px;font:700 11.5px/1 inherit;cursor:pointer;
 background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--edge)}
.scenes{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px}
.scenes::-webkit-scrollbar{display:none}
.scn{flex:0 0 auto;width:78px;cursor:pointer}
.scn .im{height:104px;border-radius:14px;overflow:hidden;background:var(--canvas);position:relative;box-shadow:0 0 0 1px var(--edge)}
.scn .im img{width:100%;height:100%;object-fit:cover;display:block}
.scn .im.busy2{box-shadow:0 0 0 2px var(--act)}
.scn .im.add2{display:grid;place-items:center;background:var(--s2);color:var(--tx3);font:300 24px/1 inherit}
.scn .im .num{position:absolute;left:6px;top:6px;font:700 9px/1 inherit;color:#fff;background:rgba(6,7,10,.6);padding:4px 5px;border-radius:5px}
.scn .cap2{font:700 9.5px/1.3 inherit;color:var(--tx3);text-align:center;margin-top:6px}
.tracks{background:var(--s1);border-radius:16px;padding:11px;box-shadow:inset 0 0 0 1px var(--edge)}
.trk{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.trk:last-child{margin-bottom:0}
.trk .tn{width:48px;flex:0 0 auto;font:700 9px/1.2 inherit;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3)}
.lane{flex:1;height:26px;border-radius:8px;background:var(--s2);display:flex;gap:3px;padding:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--edge)}
.cl{border-radius:5px;height:100%;background:#4A5060}
.cl.wv{background:repeating-linear-gradient(90deg,var(--quiet) 0 2px,transparent 2px 5px);opacity:.75}
.cl.rn{background:repeating-linear-gradient(135deg,var(--act) 0 5px,var(--act2) 5px 10px)}
.cl.em{background:transparent}
.trk .add3{width:26px;height:26px;border-radius:8px;border:0;cursor:pointer;background:var(--s2);color:var(--tx2);
 display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--edge);font:300 16px/1 inherit}
.hintline{font:600 11px/1.4 inherit;color:var(--tx3);padding:0 2px}
/* ЧАТ */
.thread{display:flex;flex-direction:column;gap:14px}
.turn{display:flex;flex-direction:column;gap:8px}
.bub{align-self:flex-end;max-width:84%;background:linear-gradient(150deg,var(--act),var(--act2));color:#fff;
 border-radius:18px 18px 6px 18px;padding:11px 13px;font:400 13.5px/1.4 inherit;box-shadow:0 10px 22px -16px var(--glow)}
.bub .att{display:flex;gap:6px;margin-bottom:8px}
.bub .att img{width:52px;height:52px;border-radius:10px;object-fit:cover;display:block}
.ai{align-self:flex-start;max-width:94%;width:100%;background:var(--s1);border-radius:18px 18px 18px 6px;
 padding:10px;box-shadow:inset 0 0 0 1px var(--edge)}
.ai .txt{font:400 13.5px/1.45 inherit;color:var(--tx);padding:2px 4px 4px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.rgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;border-radius:12px}
.rone img{width:100%;border-radius:14px;display:block}
.meta2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 4px 4px;font:650 10px/1 inherit;color:var(--tx3)}
.meta2 span{background:var(--s2);padding:5px 8px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--edge)}
.acts2{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 2px}
.acts2::-webkit-scrollbar{display:none}
.acts2 button{flex:0 0 auto;border:0;border-radius:11px;padding:9px 12px;cursor:pointer;font:700 11.5px/1 inherit;
 background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--edge);display:flex;align-items:center;gap:6px}
.acts2 button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts2 button.k{background:linear-gradient(150deg,var(--act),var(--act2));color:#fff;box-shadow:0 8px 18px -12px var(--glow)}
.audio{display:flex;align-items:center;gap:11px;padding:6px 6px 6px 4px}
.audio .play{width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;flex:0 0 auto;
 background:linear-gradient(150deg,var(--act),var(--act2));display:grid;place-items:center}
.audio .play svg{width:16px;height:16px;stroke:#fff;fill:#fff;stroke-width:1.4}
.wave{flex:1;height:32px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave i{flex:1;background:var(--quiet);border-radius:2px;opacity:.55}
.audio .tm{font:700 11px/1 inherit;color:var(--tx3);flex:0 0 auto}
.sys{align-self:center;font:650 11px/1.4 inherit;color:var(--tx3);background:var(--s2);border-radius:11px;padding:8px 12px;
 box-shadow:inset 0 0 0 1px var(--edge);text-align:center;max-width:88%}
.sys b{color:var(--tx);display:block;margin-bottom:2px}
.sys .fix{margin-top:8px;border:0;border-radius:10px;padding:8px 12px;font:700 11px/1 inherit;cursor:pointer;
 background:var(--s3);color:var(--tx)}
.newchat{flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:0;cursor:pointer;margin:0 10px 6px 0;
 background:linear-gradient(150deg,var(--act),var(--act2));display:none;place-items:center;
 box-shadow:0 8px 18px -10px var(--glow)}
.newchat.on{display:grid}
.newchat svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
.tabs button .chat-close{display:grid;place-items:center;width:18px;height:18px;margin-left:2px;border-radius:50%;color:var(--tx3);font:700 14px/1 inherit}
.tabs button .chat-close:active{background:var(--s3);color:var(--tx)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;border:0;border-radius:12px;padding:9px 12px;font:700 11.5px/1 inherit;cursor:pointer;
 background:var(--s2);color:var(--tx2);box-shadow:inset 0 0 0 1px var(--edge)}
.modelrow{display:flex;align-items:center;gap:11px;width:100%;border:0;cursor:pointer;text-align:left;
 background:var(--s2);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1px var(--edge);color:var(--tx)}
.modelrow .mi2{width:34px;height:34px;border-radius:11px;background:var(--s3);display:grid;place-items:center;flex:0 0 auto}
.modelrow .mi2 svg{width:17px;height:17px;stroke:var(--quiet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.modelrow .k{display:block;font:650 9px/1.2 inherit;color:var(--tx3);letter-spacing:.05em;text-transform:uppercase}
.modelrow .v{display:block;font:750 13px/1.2 inherit;margin-top:3px}
.modelrow .d2{display:block;font:600 10.5px/1.3 inherit;color:var(--tx3);margin-top:2px}
.modelrow .ch{margin-left:auto}
.modelrow .ch svg{width:13px;height:13px;stroke:var(--tx3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ctrls{display:flex;gap:7px;overflow-x:auto;flex:0 0 auto;padding-bottom:2px}
.ctrls::-webkit-scrollbar{display:none}
.ctrl{flex:1;min-width:0;border:0;border-radius:13px;padding:9px 10px;justify-content:center;cursor:pointer;background:var(--s2);
 box-shadow:inset 0 0 0 1px var(--edge);display:flex;align-items:center;gap:8px;color:var(--tx)}
.ctrl .box{border:1.7px solid var(--quiet);border-radius:3px;flex:0 0 auto}
.ctrl .k{font:650 9px/1.2 inherit;color:var(--tx3);display:block;letter-spacing:.04em;text-transform:uppercase}
.ctrl .v{font:750 12px/1.15 inherit;display:block;margin-top:2px;white-space:nowrap}
.ctrl svg{width:11px;height:11px;stroke:var(--tx3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stat{display:flex;align-items:center;gap:8px;font:750 10px/1 inherit;letter-spacing:.05em;color:var(--quiet);flex:0 0 auto}
.stat i{width:7px;height:7px;border-radius:50%;background:var(--act);box-shadow:0 0 9px var(--glow)}
.prog{height:4px;border-radius:99px;background:var(--s2);overflow:hidden;flex:0 0 auto}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--act),var(--act2));transition:width .3s linear}

/* НИЖНИЙ ДОК */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:9}
.promptbar{margin:0 6px -2px;border-radius:26px 26px 0 0;background:var(--prompt-glass);padding:10px 10px 14px;
 border:1px solid var(--prompt-border);border-bottom:0;
 backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%);
 box-shadow:0 -18px 40px -26px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.08)}
.promptbar[hidden]{display:none}
.ta{position:relative;margin-bottom:8px}
.promptbar textarea{width:100%;border:0;background:var(--prompt-field);border-radius:17px;color:var(--tx);font:400 17px/1.48 inherit;
 resize:none;min-height:68px;max-height:180px;outline:none;font-family:inherit;padding:14px 14px 14px 14px;
 backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);
 box-shadow:inset 0 0 0 1px var(--prompt-border),inset 0 1px 0 rgba(255,255,255,.05);scrollbar-width:none;
 transition:min-height .18s,background .18s,box-shadow .18s}
.promptbar textarea:focus{background:rgba(35,41,54,.72);
 box-shadow:inset 0 0 0 1.6px var(--act),0 0 0 3px rgba(184,34,198,.08)}
[data-mode="light"] .promptbar textarea:focus{background:rgba(255,255,255,.82)}
.clr{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;border:0;cursor:pointer;
 background:rgba(35,41,54,.34);color:var(--tx2);display:none;place-items:center;opacity:.55;
 backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
 transition:opacity .16s,background .16s,transform .16s}
[data-mode="light"] .clr{background:rgba(226,230,239,.44);box-shadow:inset 0 0 0 1px rgba(18,19,26,.08)}
.clr:hover,.clr:focus-visible{opacity:.92;background:var(--prompt-control)}
.clr:active{transform:scale(.94)}
.clr.on{display:grid}
.clr svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round}
/* При открытой клавиатуре нижняя навигация полностью схлопывается.
   Остаётся только компактная панель промта, примыкающая к клавиатуре. */
.ph.kb .dock{transform:translateY(calc(-1 * var(--keyboard-shift,0px)));transition:transform .2s cubic-bezier(.3,.9,.3,1)}
.ph.kb .navwrap{height:0!important;min-height:0;transform:translateY(100%);opacity:0;pointer-events:none;overflow:hidden;
 transition:height .22s,transform .22s,opacity .16s}
.ph.kb .promptbar{margin-bottom:0;padding-bottom:12px}
.ph.kb .promptbar textarea{min-height:68px}
.navwrap{transition:height .22s,transform .22s,opacity .18s}
.promptbar textarea::-webkit-scrollbar{display:none}
.promptbar textarea::placeholder{color:var(--tx3)}
.prow{display:flex;align-items:center;gap:7px;padding:0 2px}
.ic{width:32px;height:32px;border-radius:11px;border:0;background:var(--prompt-control);color:var(--tx2);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
 backdrop-filter:blur(12px) saturate(130%);-webkit-backdrop-filter:blur(12px) saturate(130%);
 box-shadow:inset 0 0 0 1px var(--prompt-border),inset 0 1px 0 rgba(255,255,255,.05);transition:.16s}
.ic:hover{background:rgba(184,34,198,.16);color:var(--tx)}
.ic:active{transform:scale(.95)}
.ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gen-btn{flex:1;border:0;border-radius:15px;padding:0 14px;height:42px;cursor:pointer;color:#fff;
 background:linear-gradient(150deg,var(--act),var(--act2));
 box-shadow:0 14px 26px -12px var(--glow),0 0 22px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.3);
 display:flex;align-items:center;justify-content:center;gap:8px;font:750 13.5px/1 inherit}
.gen-btn small{font:650 10px/1 inherit;opacity:.85}
.gen-btn:disabled{background:var(--prompt-control);color:var(--tx3);box-shadow:inset 0 0 0 1px var(--prompt-border)}


/* ОТДЕЛЬНЫЙ МИНИМАЛИСТИЧНЫЙ КОМПОЗЕР ЧАТА */
.chatprompt{display:none;position:relative;margin:0 6px 8px;z-index:5}
.chatprompt[hidden]{display:none!important}
.chatbox{position:relative;border-radius:28px;background:rgba(18,22,30,.86);border:1px solid rgba(255,255,255,.11);
 backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
 box-shadow:0 16px 38px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.07);overflow:visible}
[data-mode="light"] .chatbox{background:rgba(255,255,255,.9);border-color:rgba(18,19,26,.12);
 box-shadow:0 16px 34px -24px rgba(18,19,26,.45),inset 0 1px 0 rgba(255,255,255,.8)}
.chatinput{display:block;width:100%;min-height:62px;max-height:180px;resize:none;border:0;outline:0;background:transparent;color:var(--tx);
 font:400 17px/1.5 inherit;padding:16px 16px 8px;scrollbar-width:none}
.chatinput::-webkit-scrollbar{display:none}
.chatinput::placeholder{color:var(--tx3)}
.chat-composer-status{display:flex;align-items:center;gap:8px;margin:9px 10px 0;padding:9px 10px;border-radius:13px;background:var(--s2);color:var(--tx2);font:700 11px/1.3 inherit;box-shadow:inset 0 0 0 1px var(--edge)}
.chat-composer-status[hidden]{display:none}.chat-composer-status .copy{min-width:0;flex:1}.chat-composer-status b{display:block;color:var(--tx);font:750 11px/1.25 inherit}.chat-composer-status span{display:block;margin-top:2px;color:var(--tx3);font:600 9.5px/1.25 inherit}.chat-composer-status time{font:700 10px/1 inherit;color:var(--quiet);font-variant-numeric:tabular-nums}.chat-composer-status .wave{height:18px;display:flex;align-items:center;gap:2px;width:50px}.chat-composer-status .wave i{width:2px;flex:1;height:5px;border-radius:2px;background:var(--quiet);animation:phoneWave .75s ease-in-out infinite alternate}.chat-composer-status .wave i:nth-child(2n){animation-delay:.18s}.chat-composer-status .wave i:nth-child(3n){animation-delay:.34s}
.chatbox.chat-busy .chatinput{opacity:.42}.chatbox.chat-busy .chattools>button:not(#chatMic){opacity:.42;pointer-events:none}
.chattools{display:flex;align-items:center;gap:6px;padding:4px 8px 8px}
.chatspacer{flex:1}
.chatic{width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--tx2);
 transition:background .16s,color .16s,transform .16s}
.chatic:hover{background:var(--s3);color:var(--tx)}
.chatic:active{transform:scale(.94)}
.chatic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chatmodel{height:34px;max-width:118px;border:0;border-radius:999px;padding:0 10px;display:flex;align-items:center;gap:6px;cursor:pointer;
 background:transparent;color:var(--tx2);font:700 11.5px/1 inherit;box-shadow:inset 0 0 0 1px var(--edge);transition:.16s}
.chatmodel:hover{background:var(--s3);color:var(--tx)}
[data-mode="light"] .chatmodel{color:#292D39;background:rgba(238,240,246,.76);box-shadow:inset 0 0 0 1px rgba(18,19,26,.14)}
.chatmodel svg{width:14px;height:14px;stroke:var(--quiet);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.chatmodel .chatmodel-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatmodel .chev{width:10px;height:10px;stroke:var(--tx3)}
.chatplus{background:var(--s2);box-shadow:inset 0 0 0 1px var(--edge)}
.chatsend{background:var(--s3);color:var(--tx3);cursor:default}
.chatsend.ready{background:var(--tx);color:var(--bg);cursor:pointer;box-shadow:0 5px 15px -9px rgba(0,0,0,.8)}
.chatsend.ready:hover{background:var(--tx)}
.chat-plus-menu{position:absolute;left:7px;bottom:48px;z-index:8;min-width:176px;padding:6px;border-radius:16px;background:rgba(20,24,32,.94);
 border:1px solid var(--edge2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 18px 40px -20px rgba(0,0,0,.9)}
[data-mode="light"] .chat-plus-menu{background:rgba(255,255,255,.96)}
.chat-plus-menu[hidden]{display:none}
.chat-plus-menu button{width:100%;border:0;background:transparent;color:var(--tx);display:flex;align-items:center;gap:10px;border-radius:11px;
 padding:10px;font:700 12px/1 inherit;cursor:pointer;text-align:left}
.chat-plus-menu button:hover{background:var(--s2)}
.chat-plus-menu svg{width:16px;height:16px;stroke:var(--quiet);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ВЫБОР МОДЕЛЕЙ В ЧАТЕ */
.chat-model-summary{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;margin:-2px 0 13px;border-radius:15px;background:var(--s2);
 box-shadow:inset 0 0 0 1px var(--edge);color:var(--tx2);font:600 11.5px/1.4 inherit}
.chat-model-summary svg{width:18px;height:18px;stroke:var(--quiet);fill:none;stroke-width:1.9;flex:0 0 auto;margin-top:1px}
.chat-model-group{margin-top:15px}
.chat-model-group:first-of-type{margin-top:0}
.chat-model-group-title{display:flex;align-items:center;gap:8px;margin:0 3px 8px;color:var(--tx3);font:750 10px/1 inherit;letter-spacing:.12em;text-transform:uppercase}
.chat-model-group-title svg{width:15px;height:15px;stroke:var(--quiet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chat-model-option{width:100%;border:0;display:flex;align-items:center;gap:11px;padding:11px 12px;margin-bottom:6px;border-radius:15px;
 background:var(--s2);color:var(--tx);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--edge);transition:.16s}
.chat-model-option:hover{background:var(--s3)}
.chat-model-option.on{box-shadow:inset 0 0 0 1.6px var(--act),0 8px 20px -16px var(--glow)}
.chat-model-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--s3);color:var(--quiet);font:800 12px/1 inherit}
.chat-model-option.on .chat-model-icon{background:linear-gradient(150deg,var(--act),var(--act2));color:#fff}
.chat-model-copy{min-width:0;flex:1}
.chat-model-copy b{display:block;font:750 13px/1.2 inherit}
.chat-model-copy span{display:block;margin-top:3px;font:600 10.5px/1.35 inherit;color:var(--tx3)}
.chat-model-check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;border:1.5px solid var(--edge2);color:transparent}
.chat-model-option.on .chat-model-check{border-color:var(--act);background:linear-gradient(150deg,var(--act),var(--act2));color:#fff}
.chat-model-check svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* В чате основная навигация уходит вниз, остаётся только полоска */
.nav-peek{display:none;position:absolute;left:50%;bottom:3px;transform:translateX(-50%);z-index:12;width:54px;height:13px;border:0;background:transparent;
 cursor:pointer;padding:4px 7px}
.nav-peek::before{content:"";display:block;width:40px;height:4px;margin:auto;border-radius:99px;background:var(--tx3);opacity:.72;
 box-shadow:0 0 0 1px rgba(255,255,255,.05)}
.dock.chat-mode .promptbar{display:none!important}
.dock.chat-mode .chatprompt{display:block}
.dock.chat-mode .navwrap{height:14px;transition:height .28s cubic-bezier(.3,.9,.3,1)}
.dock.chat-mode .navshape{height:86px}
.dock.chat-mode .navshape,.dock.chat-mode .navglass,.dock.chat-mode .nav,.dock.chat-mode .fab,.dock.chat-mode .fabl{
 opacity:0;transform:translateY(78px);pointer-events:none;transition:transform .28s cubic-bezier(.3,.9,.3,1),opacity .18s}
.dock.chat-mode .nav-peek{display:block}
.dock.chat-mode.chat-nav-open .navwrap{height:86px}
.dock.chat-mode.chat-nav-open .navshape,.dock.chat-mode.chat-nav-open .navglass,.dock.chat-mode.chat-nav-open .nav,
.dock.chat-mode.chat-nav-open .fab,.dock.chat-mode.chat-nav-open .fabl{opacity:1;transform:none;pointer-events:auto}
.dock.chat-mode.chat-nav-open .nav-peek{bottom:2px}
.dock.chat-mode.chat-nav-open .nav-peek::before{background:var(--quiet);opacity:.9}
/* Сохраняем геометрическое центрирование FAB при анимации меню в чате */
.dock.chat-mode .fab{transform:translate(-50%,78px)}
.dock.chat-mode.chat-nav-open .fab{transform:translateX(-50%)}
.ph.kb .dock.chat-mode .navwrap{transform:none;opacity:1}
@media(max-width:360px){.chatprompt{margin-left:5px;margin-right:5px}.chatinput{font-size:16.5px}.chatmodel{max-width:102px}}

/* ПАНЕЛЬ С КАЁМКОЙ */
.navwrap{position:relative;height:86px}
.navshape{position:absolute;inset:0;width:100%;height:100%;display:block;color:var(--glass);
 filter:drop-shadow(0 -8px 24px rgba(0,0,0,.45))}
.navglass{position:absolute;left:0;right:0;top:14px;bottom:0;backdrop-filter:blur(20px) saturate(150%);
 -webkit-backdrop-filter:blur(20px) saturate(150%);pointer-events:none}
.nav{position:absolute;inset:0;display:flex;align-items:flex-end;padding:0 4px 16px}
.navmid{flex:0 0 auto;width:84px}
.nav button{flex:1;border:0;background:none;color:var(--tx2);cursor:pointer;font:750 10px/1.5 inherit;letter-spacing:-.01em;padding:0}
.nav button svg{display:block;width:22px;height:22px;margin:0 auto 3px;stroke:currentColor;fill:none;stroke-width:1.95;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="true"]{color:var(--tx)}
.nav button[aria-current="true"] svg{stroke:var(--quiet);filter:drop-shadow(0 0 8px var(--glow))}
.fab{position:absolute;left:50%;transform:translateX(-50%);top:-6px;width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
 background:linear-gradient(150deg,var(--act),var(--act2));display:grid;place-items:center;z-index:3;
 box-shadow:0 16px 30px -10px var(--glow),0 0 0 4px var(--bg),0 0 0 5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.35)}
.fab svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.fabl{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:750 10px/1 inherit;color:var(--tx);z-index:3;pointer-events:none}

/* ШТОРКИ */
.shade{position:absolute;inset:0;background:rgba(4,5,8,.66);opacity:0;pointer-events:none;transition:.2s;z-index:14}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--s1);color:var(--tx);
 border-radius:28px 28px 0 0;padding:8px 14px 24px;transform:translateY(101%);
 transition:.26s cubic-bezier(.3,.9,.3,1);max-height:74%;overflow-y:auto;
 box-shadow:0 -26px 60px -26px rgba(0,0,0,.65),inset 0 1px 0 var(--edge2),inset 0 0 0 1px var(--edge);pointer-events:none}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shead h4{margin:0}
.shead .x{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:var(--s2);color:var(--tx2);
 display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 0 0 1px var(--edge);flex:0 0 auto}
.shead .x svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.sheet::-webkit-scrollbar{width:0}
.sheet.on{transform:none;pointer-events:auto}
.sheet.tall{max-height:82%}
.grab{width:38px;height:4px;border-radius:99px;background:var(--s3);margin:0 auto 14px}
.sheet h4{font:750 17px/1.2 inherit;letter-spacing:-.03em;margin-bottom:3px}
.sheet .st{font:600 12px/1.4 inherit;color:var(--tx3);margin-bottom:12px}
.pick{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:15px;padding:12px;margin-bottom:7px;cursor:pointer;
 box-shadow:inset 0 0 0 1px var(--edge);border:0;color:var(--tx);font-family:inherit;text-align:left}
.pick.on{box-shadow:inset 0 0 0 1.8px var(--act)}
.pick .fig{width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center}
.pick .fig svg{width:20px;height:20px;stroke:var(--quiet);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pick .fig span{border:2px solid var(--quiet);border-radius:4px;display:block}
.pick b{display:block;font:750 13px/1.2 inherit}
.pick .ds{font:600 10.5px/1.35 inherit;color:var(--tx3);display:block;margin-top:3px}
.pick .r{margin-left:auto;font:700 10.5px/1 inherit;color:var(--tx3)}
.grp{font:750 9.5px/1 inherit;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);margin:15px 4px 8px}
.grp:first-of-type{margin-top:2px}
.mi{background:var(--s2);border-radius:14px;margin-bottom:6px;box-shadow:inset 0 0 0 1px var(--edge);overflow:hidden}
.mi .row{display:flex;align-items:center;gap:11px;padding:11px;cursor:pointer}
.mi .i{width:34px;height:34px;border-radius:11px;background:var(--s3);display:grid;place-items:center;flex:0 0 auto}
.mi .i svg{width:16px;height:16px;stroke:var(--quiet);fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}
.mi b{display:block;font:750 12.5px/1.2 inherit}
.mi .ds{font:600 10px/1.3 inherit;color:var(--tx3);display:block;margin-top:2px}
.theme{display:flex;gap:5px;background:var(--s2);border-radius:13px;padding:4px;margin:2px 0 12px;box-shadow:inset 0 0 0 1px var(--edge)}
.theme button{flex:1;border:0;background:none;color:var(--tx2);border-radius:10px;padding:10px 4px;font:700 11.5px/1 inherit;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}

.bal .d b{color:var(--day)}
.bal span{font:650 10.5px/1.35 inherit;color:var(--tx3)}
.toast{position:absolute;left:12px;right:12px;bottom:var(--toast-bottom,196px);z-index:20;display:flex;align-items:flex-start;gap:10px;
 min-height:48px;padding:12px 14px;border-radius:16px;color:#fff;font:750 13px/1.38 inherit;letter-spacing:-.005em;
 background:linear-gradient(135deg,rgba(109,74,255,.97),rgba(184,34,198,.95));
 border:1px solid rgba(255,255,255,.23);box-shadow:0 16px 34px -18px rgba(70,34,145,.9),inset 0 1px 0 rgba(255,255,255,.2);
 backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);
 opacity:0;transform:translateY(10px) scale(.985);transition:bottom .18s cubic-bezier(.3,.9,.3,1),opacity .18s,transform .2s;pointer-events:none}
.toast::before{content:"i";width:23px;height:23px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;margin-top:1px;
 background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);font:850 13px/1 inherit;color:#fff}
.toast.on{opacity:1;transform:none}
[data-mode="light"] .toast{color:#fff;border-color:rgba(255,255,255,.3);box-shadow:0 16px 32px -18px rgba(76,44,150,.55),inset 0 1px 0 rgba(255,255,255,.3)}
button:focus-visible,[role="button"]:focus-visible,textarea:focus-visible{outline:2px solid var(--quiet);outline-offset:2px}
/* В чате фокус переносится с textarea на весь композер — без яркой рамки вокруг текста */
.chatbox{transition:background .18s,border-color .18s,box-shadow .18s}
.chatbox:focus-within{background:rgba(18,22,30,.93);border-color:rgba(255,255,255,.17);
 box-shadow:0 18px 40px -25px rgba(0,0,0,.92),inset 0 1px 0 rgba(255,255,255,.09),inset 0 0 0 1px rgba(255,255,255,.025)}
[data-mode="light"] .chatbox:focus-within{background:rgba(255,255,255,.96);border-color:rgba(18,19,26,.17);
 box-shadow:0 18px 36px -25px rgba(18,19,26,.4),inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(18,19,26,.02)}
.chatinput{caret-color:var(--quiet);-webkit-appearance:none;appearance:none}
.chatinput:focus,.chatinput:focus-visible{outline:none!important;outline-offset:0!important;box-shadow:none!important}
.chatinput::selection{background:rgba(109,74,255,.25);color:var(--tx)}
.chatinput::-moz-selection{background:rgba(109,74,255,.25);color:var(--tx)}

const PHONE_THEME_KEY='izo-asa-phone-theme';
let themePref=['light','dark','system'].includes(localStorage.getItem(PHONE_THEME_KEY))?localStorage.getItem(PHONE_THEME_KEY):'dark';const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){app.dataset.mode=themePref==='system'?(mq.matches?'dark':'light'):themePref;
 document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===themePref)));}
mq.addEventListener('change',()=>{if(themePref==='system')applyTheme();});
let tmr;
const placeToast=()=>{
 const e=document.getElementById('toast'),app=document.getElementById('app'),dock=document.querySelector('.dock');
 if(!e||!app||!dock)return;
 const ar=app.getBoundingClientRect(),dr=dock.getBoundingClientRect();
 const visibleTop=Math.max(ar.top,Math.min(dr.top,ar.bottom));
 const bottom=Math.max(86,Math.round(ar.bottom-visibleTop+12));
 e.style.setProperty('--toast-bottom',bottom+'px');
};
const toast=t=>{
 const e=document.getElementById('toast');
 placeToast();
 e.textContent=t;e.classList.add('on');clearTimeout(tmr);
 tmr=setTimeout(()=>e.classList.remove('on'),2600);
};
window.addEventListener('resize',()=>{if(document.getElementById('toast')?.classList.contains('on'))placeToast();});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(document.getElementById('toast')?.classList.contains('on'))placeToast();});

 dayN.textContent=day;monN.textContent=mon;

 if(dayBox)dayBox.textContent=day;if(monBox)monBox.textContent=mon;
};
const IMAGE_COSTS=[1,1,2,4];
const jobs={img:0,vid:0,snd:0};
const activeCharges={img:null,vid:null,snd:null};
let gJobTab=-1,vJobTab=-1,sJobTab=-1;
const getImageCost=()=>({balance:'day',amount:IMAGE_COSTS[cnt]});
const getVideoCost=()=>({balance:'mon',amount:idx===3?45:(vd===0?8:vd===1?12:20)});
const getSoundCost=()=>idx===1?{balance:'mon',amount:8}:idx===2?{balance:'day',amount:4}:{balance:'day',amount:0};
function formatCost(cost,long=false){
 if(cost.amount===0)return long?'без списания':'0 кр.';
 if(long)return cost.amount+' '+(cost.balance==='day'?'дневных':'месячных');
 return (cost.balance==='day'?'☀':'♦')+' '+cost.amount+' кр.';
}
function charge(cost){
 const current=cost.balance==='day'?day:mon;
 if(current<cost.amount){
  toast(cost.balance==='day'?'Дневные кредиты кончились — пополните или подождите до полуночи':'Не хватает месячных кредитов');
  return false;
 }
 if(cost.balance==='day')day-=cost.amount;else mon-=cost.amount;
 credits();return true;
}
function refund(cost){
 if(!cost)return;
 if(cost.balance==='day')day+=cost.amount;else mon+=cost.amount;
 credits();
}
